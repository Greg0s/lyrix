<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrix</title>
    <!-- Generated from the logo mark by `npm run favicon:build`; theme-color is --color-page-bg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f1e7" />
    <!--
      Picks the light or dark palette before the first paint, so a dark-mode
      player never sees the page flash light while the app loads. Mirrors
      initialTheme() and applyTheme() in src/theme.ts (tests/unit/theme.test.ts).
    -->
    <script id="lyrix-theme-boot">
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("lyrix:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#140e0a");
        }
      })();
    </script>
    <!--
      Linked here rather than @imported from global.css, so the font request
      starts as soon as the HTML is parsed instead of waiting for the app's
      stylesheet to arrive. preconnect opens the two connections Google Fonts
      needs (the stylesheet host, then the font files' own host) while the
      stylesheet is still in flight.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
