<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: the page reaches under a phone's notch and home
      indicator, and game.css keeps its content out of them (safe-area insets).
      interactive-widget=resizes-content: a phone's keyboard shrinks the page
      itself, so the sticky guess dock sits right above it. Under Chrome's
      default (resizes-visual), Android browsers placed the dock by their own
      reckoning of the keyboard, wrong by a toolbar's height and changing as the
      page scrolled: docs/LEARNINGS.md, 2026-10-19.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Lyrix - retrouve la chanson du jour à partir de ses paroles</title>
    <!--
      Search and link-preview metadata. Every URL is absolute and points at the
      production site: crawlers and link unfurlers never resolve a relative one
      against the page. tests/unit/ci/richSnippets.test.ts keeps them, the
      JSON-LD below, public/robots.txt and public/sitemap.xml in step.
    -->
    <meta
      name="description"
      content="Jeu gratuit : une chanson par jour, la même pour tout le monde. Propose des mots pour dévoiler ses paroles cachées et retrouve son titre, seul ou à plusieurs."
    />
    <link rel="canonical" href="https://lyrix.mintymoon.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lyrix" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://lyrix.mintymoon.app/" />
    <meta property="og:title" content="Lyrix - retrouve la chanson du jour" />
    <meta
      property="og:description"
      content="Une chanson par jour, ses paroles cachées : propose des mots pour les dévoiler et retrouve le titre."
    />
    <!-- Generated with the favicon by `npm run favicon:build`. -->
    <meta property="og:image" content="https://lyrix.mintymoon.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Le logo Lyrix et des paroles dont certains mots sont masqués par des barres orange."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Structured data (schema.org): the site's name for search results, and
      the game itself. No rating or review: there are none to cite, and
      Google's policy forbids inventing them.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://lyrix.mintymoon.app/#website",
            "name": "Lyrix",
            "url": "https://lyrix.mintymoon.app/",
            "inLanguage": "fr"
          },
          {
            "@type": ["VideoGame", "WebApplication"],
            "@id": "https://lyrix.mintymoon.app/#game",
            "name": "Lyrix",
            "url": "https://lyrix.mintymoon.app/",
            "description": "Jeu de mots quotidien : retrouve le titre d'une chanson en dévoilant ses paroles cachées, mot après mot, seul ou dans un salon avec tes amis.",
            "image": "https://lyrix.mintymoon.app/og-image.png",
            "inLanguage": "fr",
            "genre": ["Jeu de mots", "Quiz musical"],
            "gamePlatform": "Navigateur web",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Tous (navigateur web)",
            "playMode": ["SinglePlayer", "CoOp"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "isPartOf": { "@id": "https://lyrix.mintymoon.app/#website" }
          }
        ]
      }
    </script>
    <!-- Generated from the logo mark by `npm run favicon:build`; theme-color is --color-page-bg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f1e7" />
    <!--
      Installable (#79): the manifest names the app and its icons
      (tests/unit/ci/manifest.test.ts). iOS reads the home-screen title and
      the standalone mode from these metas rather than from the manifest on
      older versions. Its status bar stays "default": "black-translucent"
      writes it in white, over the light theme's cream.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lyrix" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Picks the light or dark palette before the first paint, so a dark-mode
      player never sees the page flash light while the app loads. Mirrors
      initialTheme() and applyTheme() in src/theme.ts (tests/unit/theme.test.ts).
    -->
    <script id="lyrix-theme-boot">
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("lyrix:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#140e0a");
        }
      })();
    </script>
    <!--
      The fonts are the site's own (src/styles/fonts.css), never Google
      Fonts': a font from Google's servers hands each visitor's IP address
      to Google (tests/unit/ci/fonts.test.ts). Their latin subsets, which
      every page uses, are asked for as soon as the HTML is parsed instead of
      once the stylesheet has arrived and the page laid out.
    -->
    <link rel="preload" href="/src/assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
