name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The deploy job below only runs once a change is on main, so a
      # wrangler.toml it can no longer deploy would be found after the merge
      # rather than before it. This builds the very same configuration.
      - run: npm run deploy:check
      # worker/.dev.vars is created by the predev:worker hook that runs when
      # Playwright starts the Worker, the same path a contributor goes through.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages (lyrix-eyg.pages.dev) and the Worker (lyrix-api.lyrix.workers.dev) are
          # different origins, so the built frontend needs the Worker's absolute URL —
          # see client.ts and the VITE_API_BASE_URL comment in .env.example.
          VITE_API_BASE_URL: https://lyrix-api.lyrix.workers.dev
      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lyrix
      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml
