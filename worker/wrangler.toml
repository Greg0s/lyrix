name = "lyrix-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Rooms ("salons", issue #29): one Durable Object per room code, holding its
# members for the day (see worker/src/room.ts). SQLite-backed, which is what
# the Workers Free plan offers. No database: D1 stays reserved for accounts.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per-client limits on creating and joining rooms (worker/src/roomRoutes.ts),
# so room codes can't be enumerated. A join is what a code guess costs, so it
# is the one that matters; both stay loose enough for a class on one school
# network. The namespace ids only need to be unique on the account.
[[ratelimits]]
name = "ROOM_CREATE_LIMIT"
namespace_id = "2901"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ROOM_JOIN_LIMIT"
namespace_id = "2902"
simple = { limit = 30, period = 60 }

# STATE_SECRET is not declared here: Cloudflare rejects a `var` and a
# `secret` sharing one binding name on the same Worker. Local dev gets it
# from worker/.dev.vars (gitignored, see worker/.dev.vars.example);
# production gets it from `wrangler secret put STATE_SECRET`.

# Precomputed semantic-similarity tables, one entry per song id (see
# scripts/build-similarity-table.ts and docs/SIMILARITY.md). Created with
# `npx wrangler kv namespace create SIMILARITY`; the id is not a secret. To
# (re)load the tables after a catalog or model change:
#
#   npm run similarity:build -- --model <model.vecbin> --all --bulk
#   npx wrangler kv bulk put data/similarity/bulk.json --binding SIMILARITY --remote --config worker/wrangler.toml
#
# A song with no table in the namespace is answered without a score or close
# words, exactly as before the feature existed. Local dev (`npm run dev:all`)
# never reads this namespace: `wrangler dev` keeps KV local, and the Worker gets
# placeholder scores from the SIMILARITY_SAMPLE var instead. Real tables can be
# played locally with `npm run dev:debug` (worker/wrangler.debug.toml).
[[kv_namespaces]]
binding = "SIMILARITY"
id = "90be993fabd1457e9cb7a8e4280e477c"
