# Local-only twin of wrangler.toml: the same Worker, plus a SIMILARITY KV
# namespace that exists nowhere but this machine, so `npm run dev:debug`
# can serve a real precomputed table (scripts/build-similarity-table.ts)
# instead of the hand-written placeholder one.
#
# `wrangler deploy` never reads this file. The CI deploy job passes
# `--config worker/wrangler.toml` (see .github/workflows/ci.yml), which binds
# no namespace at all — that is why the binding cannot simply live there: a
# made-up namespace id fails the whole deploy, and the real one has to exist on
# the account first (see the note in wrangler.toml). Keeping the local binding
# in its own file leaves production exactly as it was, warnings included: a
# `[env.…]` section in wrangler.toml would have made every deploy log one.
#
# Everything else here has to stay in step with wrangler.toml — a Worker run
# locally under a different compatibility date is not the Worker being shipped.
# tests/unit/ci/debugMode.test.ts compares the two files and fails on any
# difference other than the binding below.
#
# STATE_SECRET comes from worker/.dev.vars, exactly as it does for wrangler.toml:
# wrangler looks for it next to the configuration file it was given.

name = "lyrix-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Rooms ("salons", issue #29): one Durable Object per room code, holding its
# members for the day (see worker/src/room.ts). SQLite-backed, which is what
# the Workers Free plan offers. No database: D1 stays reserved for accounts.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per-client limits on creating and joining rooms (worker/src/roomRoutes.ts),
# so room codes can't be enumerated. A join is what a code guess costs, so it
# is the one that matters; both stay loose enough for a class on one school
# network. The namespace ids only need to be unique on the account.
[[ratelimits]]
name = "ROOM_CREATE_LIMIT"
namespace_id = "2901"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ROOM_JOIN_LIMIT"
namespace_id = "2902"
simple = { limit = 30, period = 60 }

[[kv_namespaces]]
binding = "SIMILARITY"
# Local dev only. `wrangler dev` (and `wrangler kv … --local`) use this id as a
# directory name under --persist-to and never as an account resource, so it is
# deliberately not the 32 hex characters a real namespace id has: should this
# configuration ever be handed to `wrangler deploy` by accident, Cloudflare
# rejects it instead of publishing a Worker bound to something unexpected.
id = "local-debug-dev-only"
